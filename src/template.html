<slot name="scroller">
  <ul></ul>
</slot>

<div part="buttons" style="display: none !important;">
  <slot name="before-prev"></slot>
  <slot name="prev-buttons">
    <button part="button control-button prev-button" type="button" direction="prev">
      <slot name="prev-icon"></slot>
      <span part="prev-label"></span>
    </button>
  </slot>
  <slot name="next-buttons">
    <button part="button control-button next-button" type="button" direction="next">
      <span part="next-label"></span>
      <slot name="next-icon"></slot>
    </button>
  </slot>
  <slot name="after-next"></slot>
</div>

<slot name="pagination">
  <div part="nav" style="display: none !important;"></div>
</slot>

<div part="pager" style="display: none !important;"><span part="current"></span><span part="page-sep"></span><span part="total"></span></div>
