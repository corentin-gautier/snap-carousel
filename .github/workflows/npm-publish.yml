# Publishes the package to npm when a GitHub release is created.
# Authenticates with npm Trusted Publishing (OIDC), no token needed:
# https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  id-token: write # Lets the job request the OIDC token npm exchanges for publish rights
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1+, bundled with Node 24
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm test
      - run: npm publish
